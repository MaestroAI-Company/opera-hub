name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # prebuilt client pulled by the opera android build
  android-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a build --locked --release -p opera-hub-client

      # stripped lib so bindings read the host build
      - name: Generate kotlin bindings
        run: |
          cargo build --locked -p opera-hub-client
          cargo run --locked -q -p uniffi-bindgen -- generate \
            --library target/debug/libopera_hub_client.so \
            --language kotlin --no-format --out-dir bindings

      - name: Collect assets
        run: |
          mkdir dist
          cp target/aarch64-linux-android/release/libopera_hub_client.so dist/opera-hub-client-arm64-v8a.so
          cp bindings/uniffi/opera_hub_client/opera_hub_client.kt dist/opera_hub_client.kt

      - uses: actions/upload-artifact@v4
        with:
          name: android-client
          path: dist/

  # prebuilt client pulled by the opera web build
  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # must match the wasm-bindgen crate in Cargo.lock
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - name: Build module
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p opera-hub-client
          wasm-bindgen --target web --out-dir bindings             target/wasm32-unknown-unknown/release/opera_hub_client.wasm

      - name: Collect assets
        run: |
          mkdir dist
          cp bindings/opera_hub_client.js dist/opera-hub-client-web.js
          cp bindings/opera_hub_client_bg.wasm dist/opera-hub-client-web.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: web-client
          path: dist/

  hub:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: opera-hub-linux-x86_64, bin: opera-hub }
          - { os: ubuntu-24.04-arm, name: opera-hub-linux-aarch64, bin: opera-hub }
          - { os: macos-latest, name: opera-hub-macos-aarch64, bin: opera-hub }
          - { os: windows-latest, name: opera-hub-windows-x86_64.exe, bin: opera-hub.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --locked --release -p opera-hub

      - name: Collect binary
        shell: bash
        run: |
          mkdir dist
          cp target/release/${{ matrix.bin }} dist/${{ matrix.name }}
          # background start needs the tray twin next to it
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/opera-hubw.exe dist/opera-hubw-windows-x86_64.exe
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp target/release/opera-hubw dist/opera-hubw-macos-aarch64
          fi

      # the tauri bundler, it fetches nsis itself
      - name: Install cargo-packager
        if: runner.os != 'Linux'
        run: cargo install cargo-packager --locked

      # per user setup, also what windows hubs update from
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo packager -p opera-hub --release --formats nsis
          cp target/release/*-setup.exe dist/opera-hub-setup-windows-x86_64.exe

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          cargo packager -p opera-hub --release --formats dmg
          cp target/release/*.dmg dist/opera-hub-macos-aarch64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  publish:
    needs: [android-client, web-client, hub]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # linux and macos install from this script
      - name: Add install script
        run: cp installer/install.sh dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Opera Hub ${GITHUB_REF_NAME#v}" --generate-notes
