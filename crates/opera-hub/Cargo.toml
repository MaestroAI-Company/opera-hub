[package]
name = "opera-hub"
version = "0.10.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
chacha20poly1305 = "0.11"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6"
gethostname = "1"
getrandom = "0.4"
iroh = "1.3"
iroh-tickets = "1"
flate2 = "1"
keyring = "4"
mdns-sd = "0.21"
opera-hub-proto = { version = "0.10.0", path = "../opera-hub-proto" }
qr2term = "0.3.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form", "json"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tar = "0.4"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[target."cfg(not(windows))".dependencies]
service-manager = "0.11"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
png = { version = "0.18", optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
rfd = { version = "0.17", default-features = false, optional = true }
softbuffer = { version = "0.4", optional = true }
sys-locale = { version = "0.3", optional = true }
tao = { version = "0.37", optional = true }
tray-icon = { version = "0.26", default-features = false, optional = true }

[features]
default = ["tray"]
# apps embedding the hub skip the tray
tray = ["dep:png", "dep:qrcode", "dep:rfd", "dep:softbuffer", "dep:sys-locale", "dep:tao", "dep:tray-icon"]

[[bin]]
name = "opera-hubw"
path = "src/bin/opera-hubw/main.rs"
required-features = ["tray"]

# installers built by cargo-packager, the bundler from tauri
[package.metadata.packager]
product-name = "Opera Hub"
identifier = "company.maestroai.opera-hub"
publisher = "Maestro AI"
authors = ["Maestro AI"]
description = "The sync hub for Opera devices"
homepage = "https://github.com/MaestroAI-Company/opera-hub"
before-packaging-command = "cargo build --release -p opera-hub"
binaries = [{ path = "opera-hubw", main = true }, { path = "opera-hub", main = false }]
icons = ["assets/icons/32x32.png", "assets/icons/128x128.png", "assets/icons/128x128@2x.png", "assets/icons/icon.icns", "assets/icons/icon.ico"]

[package.metadata.packager.nsis]
# per user, no admin rights
installer-mode = "currentUser"
languages = ["English", "French"]
# the uninstaller offers to delete pairings and data, off by default
appdata-paths = ["$LOCALAPPDATA/MaestroAI-Company/Opera Hub/data"]
# company folder, login start removed again by the uninstaller
preinstall-section = '''
InstallDir "$LOCALAPPDATA\MaestroAI-Company\Opera Hub"

Section LoginStart
  WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "OperaHub" '"$INSTDIR\opera-hubw.exe"'
SectionEnd

Section un.LoginStart
  DeleteRegValue HKCU "Software\Microsoft\Windows\CurrentVersion\Run" "OperaHub"
SectionEnd

Section un.CliPath
  nsExec::Exec '"$INSTDIR\opera-hub.exe" service uninstall'
  Pop $0
SectionEnd
'''
