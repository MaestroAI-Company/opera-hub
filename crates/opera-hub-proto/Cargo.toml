[package]
name = "opera-hub-proto"
version = "0.9.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
getrandom = "0.4"
hmac = "0.13"
iroh = "1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.53.2", default-features = false, features = ["io-util"] }
url = "2"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt"] }
