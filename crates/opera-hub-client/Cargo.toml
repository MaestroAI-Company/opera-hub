[package]
name = "opera-hub-client"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = "1.0.104"
bytes = "1"
futures-util = "0.3"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iroh = "1.3"
opera-hub-proto = { version = "0.3.0", path = "../opera-hub-proto" }
serde = "1.0.229"
thiserror = "2"
tokio = { version = "1.53.2", features = ["io-util", "net", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
uniffi = { version = "0.32", features = ["tokio"] }

[dev-dependencies]
bytes = "1"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
opera-hub = { path = "../opera-hub" }
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "time"] }
