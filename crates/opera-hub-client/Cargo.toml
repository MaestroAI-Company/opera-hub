[package]
name = "opera-hub-client"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = "1.0.104"
iroh = "1.3"
opera-hub-proto = { version = "0.2.0", path = "../opera-hub-proto" }
serde = "1.0.229"
thiserror = "2"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync"] }
uniffi = { version = "0.32", features = ["tokio"] }

[dev-dependencies]
getrandom = "0.4"
opera-hub = { path = "../opera-hub" }
tokio = { version = "1.53.2", features = ["macros", "time"] }
