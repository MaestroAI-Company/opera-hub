[package]
name = "opera-hub-client"
version = "0.7.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
anyhow = "1.0.104"
iroh = "1.3"
n0-future = "0.3"
opera-hub-proto = { version = "0.7.0", path = "../opera-hub-proto" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.53.2", features = ["io-util", "sync"] }

# apps get uniffi bindings and a local proxy
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
bytes = "1"
futures-util = "0.3"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mdns-sd = "0.21"
tokio = { version = "1.53.2", features = ["net", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uniffi = { version = "0.32", features = ["tokio"] }

# browsers get wasm-bindgen exports
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
bytes = "1"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
opera-hub = { path = "../opera-hub" }
serde_json = "1.0.154"
sha2 = "0.11"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "time"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
